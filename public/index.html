<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Игра для сбора опечаток</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app" id="game" tabindex="-1">
      <h1>Сбор датасета опечаток</h1>
      <section class="card instruction">
        <p class="instruction-text">
          Инструкция: печатай предложение символ за символом. Текущий нужный символ
          подсвечен в строке выше, исправлять введенные символы нельзя.
        </p>
      </section>

      <section class="card typing-card" id="typingCard">
        <p class="label">Перепечатай предложение (нажми на текст для клавиатуры):</p>
        <div class="target-wrap">
          <p id="target" class="target">Загрузка...</p>
          <input
            id="typingInput"
            class="typing-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
            aria-label="Ввод текста"
          />
        </div>
      </section>

      <section class="card last-typed-card" id="lastTypedCard" hidden>
        <p class="label">Вы отправили:</p>
        <p id="lastTyped" class="last-typed"></p>
      </section>

      <section class="card">
        <button id="nextBtn" type="button">Следующее предложение</button>
        <p id="status" class="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
