<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Игра для сбора опечаток</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Сбор датасета опечаток</h1>

      <section class="card">
        <p class="label">Перепечатай предложение (можно смотреть):</p>
        <p id="target" class="target">Загрузка...</p>
      </section>

      <section class="card typing-zone">
        <p class="label">То, что видит игрок при вводе:</p>
        <p id="masked" class="masked"></p>
        <p id="progress" class="progress"></p>
      </section>

      <section class="card">
        <button id="nextBtn" type="button">Следующее предложение</button>
        <p id="status" class="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
